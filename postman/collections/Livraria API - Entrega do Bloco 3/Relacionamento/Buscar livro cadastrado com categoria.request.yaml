$kind: http-request
url: "{{baseUrl}}/livros/{{livroRelacionamentoId}}"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Livro possui categoria correta", function () {
          const livro = pm.response.json();

          pm.expect(livro.titulo).to.eql("Livro Teste Relacionamento");
          pm.expect(livro.categoria).to.eql("Tecnologia");
          pm.expect(livro.categoria_id).to.eql(2);
      });
    language: text/javascript
order: 2500
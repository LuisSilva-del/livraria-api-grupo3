$kind: http-request
url: "{{baseUrl}}/livros/1"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Veio o nome da categoria", function () {
          pm.expect(pm.response.json().categoria).to.eql("Tecnologia");
      });

      pm.test("Livro retornado é Clean Code", function () {
          pm.expect(pm.response.json().titulo).to.eql("Clean Code");
      });

      pm.test("Livro pertence à categoria Tecnologia", function () {
          pm.expect(pm.response.json().categoria_id).to.eql(2);
      });
    language: text/javascript
order: 1000
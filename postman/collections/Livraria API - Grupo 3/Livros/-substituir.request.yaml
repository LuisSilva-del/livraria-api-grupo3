$kind: http-request
name: '6 - Substituir tudo'
url: '{{baseUrl}}/livros/{{livroId}}'
method: PUT
body:
  type: json
  content: |-
    {
        "titulo": "O Hobbit",
        "autor": "J.R.R. Tolkien",
        "preco": 42,
        "estoque": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
